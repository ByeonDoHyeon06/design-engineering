name: Validate Design Engineering

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check installed skill contents
        run: python scripts/validate_install.py --root . --smoke

      - name: Validate Knowledge and provenance
        run: |
          python scripts/knowledge_health.py --json
          python scripts/knowledge_graph.py validate
          python scripts/audit_evidence.py

      - name: Unified CLI package and smoke
        run: |
          python -m pip install -e .
          de --version
          de check
          python scripts/de.py --version
      - name: Build and validate isolated distribution wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --no-index --find-links="$RUNNER_TEMP/wheels" design-engineering-skill
          mkdir -p "$RUNNER_TEMP/wheel-consumer"
          cd "$RUNNER_TEMP/wheel-consumer"
          "$RUNNER_TEMP/wheel-venv/bin/de" --version
          DE_CACHE_HOME="$RUNNER_TEMP/wheel-cache" "$RUNNER_TEMP/wheel-venv/bin/de" check --smoke
          DE_CACHE_HOME="$RUNNER_TEMP/wheel-cache" "$RUNNER_TEMP/wheel-venv/bin/de" search "한글 폰트 줄바꿈" --scope core --json > search.json
          "$RUNNER_TEMP/wheel-venv/bin/python" -c 'import json; from pathlib import Path; assert json.loads(Path("search.json").read_text())["research"]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Blinded design-study schema smoke (no agent runs or scores)
        run: |
          de eval tasks --json > "$RUNNER_TEMP/evaluation-tasks.json"
          de eval init --out "$RUNNER_TEMP/design-eval-empty" --seed 42 --agent "ci-schema-only" --model "not-executed" --effort "not-executed"
          de eval validate --run "$RUNNER_TEMP/design-eval-empty" --json
          de eval report --run "$RUNNER_TEMP/design-eval-empty" --json > "$RUNNER_TEMP/evaluation-empty.json"
          python -c 'import json,os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"evaluation-empty.json").read_text()); assert r["status"]=="NO_OBSERVATIONS"; assert r["summary"]["rated_tasks"]==0'
      - name: Retrieval regressions
        run: |
          python scripts/retrieval_evaluation.py --dataset benchmarks/retrieval-core.json --top 3
          python scripts/retrieval_evaluation.py --dataset benchmarks/retrieval-typography.json --top 5
          python scripts/retrieval_evaluation.py --dataset benchmarks/retrieval-relevance.json --top 3

      - name: Synthetic graph and SQLite scale checks
        run: python scripts/knowledge_scale_benchmark.py --size 1000 --size 10000 --search-size 1000

  wheel-portability:
    name: Wheel portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and exercise CLI outside checkout
        shell: bash
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          python -m venv .wheel-venv
          ROOT_DIR="$PWD"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PY="$ROOT_DIR/.wheel-venv/Scripts/python.exe"
            DE="$ROOT_DIR/.wheel-venv/Scripts/de.exe"
          else
            PY="$ROOT_DIR/.wheel-venv/bin/python"
            DE="$ROOT_DIR/.wheel-venv/bin/de"
          fi
          "$PY" -m pip install --no-index --find-links wheelhouse design-engineering-skill
          # The consumer directory is a sibling of the source checkout, not beneath it.
          mkdir -p "$ROOT_DIR/../wheel-consumer"
          cd "$ROOT_DIR/../wheel-consumer"
          "$DE" --version
          "$DE" check --smoke --json
          "$DE" search "한글 폰트 줄바꿈" --scope core --json > result.json
          "$PY" -c 'import json; from pathlib import Path; assert json.loads(Path("result.json").read_text(encoding="utf-8"))["research"]'
