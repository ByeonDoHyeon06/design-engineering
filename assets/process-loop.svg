<text x="283" y="108" fill="#182233" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing=".8">RESEARCH</text>
<text x="283" y="132" fill="#697380" font-family="Arial,Helvetica,sans-serif" font-size="12">Check evidence</text><path d="M479 101h18m-7-5 7 5-7 5" fill="none" stroke="#6D7D9B" stroke-width="1.5" stroke-linejoin="miter"/><rect x="502" y="44" width="213" height="116" fill="#FAF9F4" stroke="#CFD1CC" stroke-width="1"/>
<rect x="502" y="44" width="213" height="5" fill="#738BFE"/>
<text x="521" y="76" fill="#7883A0" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.7" font-weight="700">03</text>
<text x="521" y="108" fill="#182233" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing=".8">EXPLORE</text>
<text x="521" y="132" fill="#697380" font-family="Arial,Helvetica,sans-serif" font-size="12">Compare directions</text><path d="M717 101h18m-7-5 7 5-7 5" fill="none" stroke="#6D7D9B" stroke-width="1.5" stroke-linejoin="miter"/><rect x="740" y="44" width="213" height="116" fill="#FAF9F4" stroke="#CFD1CC" stroke-width="1"/>
