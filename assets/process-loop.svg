<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="210" viewBox="0 0 1440 210" role="img" aria-labelledby="title desc"><title id="title">Design Engineering working loop</title><desc id="desc">Six connected phases: Understand, Research, Explore, Build, Validate, Refine; the review loop returns feedback into the next design iteration.</desc><rect width="1440" height="210" fill="#F0EEE8"/>
