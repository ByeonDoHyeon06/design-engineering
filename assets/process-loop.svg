<text x="759" y="76" fill="#7883A0" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.7" font-weight="700">04</text>
<text x="759" y="108" fill="#182233" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing=".8">BUILD</text>
<text x="759" y="132" fill="#697380" font-family="Arial,Helvetica,sans-serif" font-size="12">Make it tangible</text><path d="M955 101h18m-7-5 7 5-7 5" fill="none" stroke="#6D7D9B" stroke-width="1.5" stroke-linejoin="miter"/><rect x="978" y="44" width="213" height="116" fill="#172232" stroke="#172232" stroke-width="1"/>
