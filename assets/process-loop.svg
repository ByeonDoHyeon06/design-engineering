<text x="45" y="108" fill="#182233" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing=".8">UNDERSTAND</text>
<text x="45" y="132" fill="#697380" font-family="Arial,Helvetica,sans-serif" font-size="12">Define the question</text><path d="M241 101h18m-7-5 7 5-7 5" fill="none" stroke="#6D7D9B" stroke-width="1.5" stroke-linejoin="miter"/><rect x="264" y="44" width="213" height="116" fill="#FAF9F4" stroke="#CFD1CC" stroke-width="1"/>
