<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Illustrative macOS-style terminal with Design Engineering commands"><rect width="1200" height="690" fill="#E8EAED"/><rect x="48" y="50" width="1104" height="588" rx="17" fill="#11161C" stroke="#303944" stroke-width="2"/><path d="M65 50h1070a17 17 0 0 1 17 17v39H48V67a17 17 0 0 1 17-17Z" fill="#222B35"/><circle cx="80" cy="78" r="7" fill="#FF625A"/><circle cx="106" cy="78" r="7" fill="#FFBE2E"/><circle cx="132" cy="78" r="7" fill="#2ACA45"/><text x="600" y="84" fill="#A9B5C0" font-family="ui-monospace, Menlo, monospace" font-size="15" text-anchor="middle">design-engineering — zsh</text><text x="86" y="158" fill="#E8EFF3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.3s" begin="0s" fill="freeze"/>>$ de search "mixed-script headings"</text><text x="86" y="203" fill="#7CCEC8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.3s" begin="0.85s" fill="freeze"/>>  → retrieve contextual sources</text><text x="86" y="248" fill="#E8EFF3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.3s" begin="1.7s" fill="freeze"/>>$ de search "mixed-script headings" --explain</text><text x="86" y="293" fill="#7CCEC8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.3s" begin="2.55s" fill="freeze"/>>  → review provenance and limitations</text><text x="86" y="338" fill="#E8EFF3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.3s" begin="3.4s" fill="freeze"/>>$ de check</text><text x="86" y="383" fill="#7CCEC8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.3s" begin="4.25s" fill="freeze"/>>  → run repository checks</text><text x="86" y="428" fill="#F4BB79" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="1.3s" begin="5.1s" fill="freeze"/>>  → inspect rendered result</text><text x="86" y="580" fill="#738393" font-size="14" font-family="ui-monospace, Menlo, monospace">ILLUSTRATIVE CLI SESSION · NOT A RECORDED RUN</text></svg>