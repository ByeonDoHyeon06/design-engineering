<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="Illustrative macOS-style terminal with Design Engineering commands"><rect width="1200" height="690" fill="#E8EAED"/><rect x="48" y="50" width="1104" height="588" rx="17" fill="#11161C" stroke="#303944" stroke-width="2"/><path d="M65 50h1070a17 17 0 0 1 17 17v39H48V67a17 17 0 0 1 17-17Z" fill="#222B35"/><circle cx="80" cy="78" r="7" fill="#FF625A"/><circle cx="106" cy="78" r="7" fill="#FFBE2E"/><circle cx="132" cy="78" r="7" fill="#2ACA45"/><text x="600" y="84" fill="#A9B5C0" font-family="ui-monospace, Menlo, monospace" font-size="15" text-anchor="middle">design-engineering — zsh</text><text x="86" y="158" fill="#E8EFF3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">$ de add "Prefer precise square layouts" --scope project</text><text x="86" y="203" fill="#7CCEC8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">  → saved as reviewable proposal</text><text x="86" y="248" fill="#E8EFF3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">$ de review --list</text><text x="86" y="293" fill="#7CCEC8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">  → owner approval is required</text><text x="86" y="338" fill="#E8EFF3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">$ de context --conflicts</text><text x="86" y="383" fill="#F4BB79" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21">  → inspect preference tensions</text><text x="86" y="580" fill="#738393" font-size="14" font-family="ui-monospace, Menlo, monospace">ILLUSTRATIVE CLI SESSION · NOT A RECORDED RUN</text></svg>