<svg xmlns="http://www.w3.org/2000/svg" width="560" height="795" viewBox="0 0 560 795" role="img" aria-labelledby="t d">
<title id="t">Design Engineering workflow — mobile</title>
<desc id="d">Six vertical phases: Understand, Research, Explore, Build, Validate, Refine. A feedback arrow returns to the first step.</desc>
<rect width="560" height="795" fill="#F2F0EA"/><rect x="22" y="22" width="516" height="748" fill="none" stroke="#CED1CD"/>
<text x="48" y="59" fill="#334154" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="1.3">DESIGN AS AN ITERATIVE PROCESS</text>
<rect x="59" y="87" width="442" height="82" fill="#FFFDF8" stroke="#BEC5C5"/>
<rect x="59" y="87" width="6" height="82" fill="#788FFC"/>
<text x="83" y="119" fill="#657A9D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">01</text>
<text x="135" y="118" fill="#26364C" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing=".8">UNDERSTAND</text>
<text x="135" y="143" fill="#69798B" font-family="Arial,Helvetica,sans-serif" font-size="16">Define the question</text><path d="M280 169v23m-7-8 7 8 7-8" fill="none" stroke="#899AAC" stroke-width="2"/><rect x="59" y="192" width="442" height="82" fill="#FFFDF8" stroke="#BEC5C5"/>
<rect x="59" y="192" width="6" height="82" fill="#788FFC"/>
<text x="83" y="224" fill="#657A9D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">02</text>
<text x="135" y="223" fill="#26364C" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing=".8">RESEARCH</text>
<text x="135" y="248" fill="#69798B" font-family="Arial,Helvetica,sans-serif" font-size="16">Check useful evidence</text><path d="M280 274v23m-7-8 7 8 7-8" fill="none" stroke="#899AAC" stroke-width="2"/><rect x="59" y="297" width="442" height="82" fill="#FFFDF8" stroke="#BEC5C5"/>
<rect x="59" y="297" width="6" height="82" fill="#788FFC"/>
<text x="83" y="329" fill="#657A9D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">03</text>
<text x="135" y="328" fill="#26364C" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing=".8">EXPLORE</text>
<text x="135" y="353" fill="#69798B" font-family="Arial,Helvetica,sans-serif" font-size="16">Compare directions</text><path d="M280 379v23m-7-8 7 8 7-8" fill="none" stroke="#899AAC" stroke-width="2"/><rect x="59" y="402" width="442" height="82" fill="#FFFDF8" stroke="#BEC5C5"/>
<rect x="59" y="402" width="6" height="82" fill="#788FFC"/>
<text x="83" y="434" fill="#657A9D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">04</text>
<text x="135" y="433" fill="#26364C" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing=".8">BUILD</text>
<text x="135" y="458" fill="#69798B" font-family="Arial,Helvetica,sans-serif" font-size="16">Make it tangible</text><path d="M280 484v23m-7-8 7 8 7-8" fill="none" stroke="#899AAC" stroke-width="2"/><rect x="59" y="507" width="442" height="82" fill="#1D2C42" stroke="#1D2C42"/>
<rect x="59" y="507" width="6" height="82" fill="#E8A77F"/>
<text x="83" y="539" fill="#A6B7FF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">05</text>
<text x="135" y="538" fill="#F5F5EF" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing=".8">VALIDATE</text>
<text x="135" y="563" fill="#C6D3E3" font-family="Arial,Helvetica,sans-serif" font-size="16">Inspect the real output</text><path d="M280 589v23m-7-8 7 8 7-8" fill="none" stroke="#899AAC" stroke-width="2"/><rect x="59" y="612" width="442" height="82" fill="#FFFDF8" stroke="#BEC5C5"/>
<rect x="59" y="612" width="6" height="82" fill="#788FFC"/>
<text x="83" y="644" fill="#657A9D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">06</text>
<text x="135" y="643" fill="#26364C" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing=".8">REFINE</text>
<text x="135" y="668" fill="#69798B" font-family="Arial,Helvetica,sans-serif" font-size="16">Revise and repeat</text><path d="M508 691h20V122h-19" fill="none" stroke="#899BC5" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M515 115l-7 7 7 7" fill="none" stroke="#899BC5" stroke-width="2"/>
<text x="59" y="748" fill="#63738A" font-family="Arial,Helvetica,sans-serif" font-size="14">REFINE → RE-EVALUATE</text>
</svg>